name: Build Frame Generator mod

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this mod's source
        uses: actions/checkout@v4

      - name: Check out preloader-android SDK
        run: git clone --depth 1 https://github.com/LiteLDev/preloader-android preloader-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Release
          -DPRELOADER_ANDROID_ROOT=${{ github.workspace }}/preloader-android

      - name: Build
        run: cmake --build build --target framegen_mod

      - name: Package
        run: |
          mkdir -p dist/framegen-mod
          cp build/out/arm64-v8a/libframegen_mod.so dist/framegen-mod/
          cp manifest.json dist/framegen-mod/
          cd dist/framegen-mod
          zip -r ../framegen-mod.levipack .

      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: framegen-mod
          path: dist/framegen-mod.levipack
